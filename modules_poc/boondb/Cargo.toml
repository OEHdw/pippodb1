[package]
name = "boondb"
version = "0.1.0"
edition = "2021"
authors = ["BOONDB Contributors"]
description = "A document database with native BOON (Binary Object-Oriented Notation) support"
license = "Apache-2.0"
repository = "https://github.com/boondb/boondb"
keywords = ["database", "document", "boon", "nosql"]
categories = ["database"]

[lib]
name = "boondb"
path = "src/lib.rs"

[[bin]]
name = "boondb-server"
path = "src/bin/server.rs"

[[bin]]
name = "boondb-cli"
path = "src/bin/cli.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP server
axum = "0.7"

# Storage backend
rusqlite = { version = "0.31", features = ["bundled"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
bytes = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
ordered-float = "4.0"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.0"
proptest = "1.0"

[[bench]]
name = "boon_serialization"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
